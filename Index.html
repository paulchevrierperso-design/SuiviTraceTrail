    <script>
        const PALETTE = [
            { hex: '#3b82f6', rgb: '59, 130, 246' },   // Bleu
            { hex: '#10b981', rgb: '16, 185, 129' },   // Émeraude
            { hex: '#f59e0b', rgb: '245, 158, 11' },   // Ambre
            { hex: '#ec4899', rgb: '236, 72, 153' },   // Rose
            { hex: '#8b5cf6', rgb: '139, 92, 246' },   // Violet
            { hex: '#06b6d4', rgb: '6, 182, 212' },    // Cyan
            { hex: '#ef4444', rgb: '239, 68, 68' },    // Rouge
            { hex: '#a855f7', rgb: '168, 85, 247' },   // Violet clair
            { hex: '#14b8a6', rgb: '20, 184, 166' }    // Turquoise
        ];

        let tracks = [];
        let selectedTrackIds = []; 
        let comparisonMode = 'distance'; 
        let map, chart;
        let mapMarkers = {}; 
        let mapPolylines = {}; 
        let startLineMarker = null;

        // ==========================================
        // DÉCODEUR FIT NATIF (Avec Horodatage)
        // ==========================================
        class SimpleFitParser {
            constructor(arrayBuffer) {
                this.view = new DataView(arrayBuffer);
                this.offset = 0;
                this.definitions = {};
                this.records = [];
            }

            parse() {
                if (this.view.byteLength < 12) throw new Error("Fichier trop court.");
                const headerSize = this.view.getUint8(0);
                const signature = String.fromCharCode(
                    this.view.getUint8(8), this.view.getUint8(9),
                    this.view.getUint8(10), this.view.getUint8(11)
                );
                if (signature !== ".FIT") throw new Error("Format FIT invalide.");

                const dataSize = this.view.getUint32(4, true);
                this.offset = headerSize;
                const endOffset = headerSize + dataSize;

                while (this.offset < endOffset && this.offset < this.view.byteLength) {
                    const headerByte = this.view.getUint8(this.offset);
                    this.offset++;

                    if ((headerByte & 0x80) === 0x80) {
                        const localMsgType = (headerByte >> 5) & 0x03;
                        this.parseDataMessage(localMsgType);
                        continue;
                    }

                    const isDefinition = (headerByte & 0x40) === 0x40;
                    const hasDevData = (headerByte & 0x20) === 0x20;
                    const localMsgType = headerByte & 0x0F;

                    if (isDefinition) {
                        this.parseDefinitionMessage(localMsgType, hasDevData);
                    } else {
                        this.parseDataMessage(localMsgType);
                    }
                }
                return { records: this.records };
            }

            parseDefinitionMessage(localMsgType, hasDevData) {
                if (this.offset + 5 > this.view.byteLength) { this.offset = this.view.byteLength; return; }
                this.offset++; 
                const architecture = this.view.getUint8(this.offset);
                this.offset++;
                const isLittleEndian = (architecture === 0);
                const globalMsgNum = this.view.getUint16(this.offset, isLittleEndian);
                this.offset += 2;
                const numFields = this.view.getUint8(this.offset);
                this.offset++;

                const fields = [];
                for (let i = 0; i < numFields; i++) {
                    if (this.offset + 3 > this.view.byteLength) break;
                    const fieldNum = this.view.getUint8(this.offset);
                    const size = this.view.getUint8(this.offset + 1);
                    const baseType = this.view.getUint8(this.offset + 2);
                    this.offset += 3;
                    fields.push({ fieldNum, size, baseType });
                }

                let devFields = [];
                if (hasDevData && this.offset < this.view.byteLength) {
                    const numDevFields = this.view.getUint8(this.offset);
                    this.offset++;
                    for (let i = 0; i < numDevFields; i++) {
                        if (this.offset + 3 > this.view.byteLength) break;
                        const fieldNum = this.view.getUint8(this.offset);
                        const size = this.view.getUint8(this.offset + 1);
                        this.offset += 3;
                        devFields.push({ fieldNum, size });
                    }
                }

                this.definitions[localMsgType] = { globalMsgNum, isLittleEndian, fields, devFields };
            }

            parseDataMessage(localMsgType) {
                const def = this.definitions[localMsgType];
                if (!def) { this.offset = this.view.byteLength; return; }

                const record = {};
                const isRecordMessage = (def.globalMsgNum === 20); 

                def.fields.forEach(field => {
                    const value = this.readFieldValue(field.size, field.baseType, def.isLittleEndian);
                    if (isRecordMessage) {
                        if (field.fieldNum === 0 && value !== null) record.position_lat = value;
                        if (field.fieldNum === 1 && value !== null) record.position_long = value;
                        if (field.fieldNum === 2 && value !== null) record.altitude = (value / 5.0) - 500.0;
                        if (field.fieldNum === 78 && value !== null) record.enhanced_altitude = (value / 3000.0) - 500.0;
                        if (field.fieldNum === 5 && value !== null) record.distance = value / 100.0;
                        if (field.fieldNum === 253 && value !== null) record.timestamp = value; 
                    }
                });

                def.devFields.forEach(field => { this.offset += field.size; });

                if (isRecordMessage && (record.position_lat !== undefined || record.position_long !== undefined)) {
                    this.records.push(record);
                }
            }

            readFieldValue(size, baseType, isLittleEndian) {
                if (this.offset + size > this.view.byteLength) { this.offset += size; return null; }
                let val = null;
                try {
                    switch(baseType) {
                        case 0x01: val = this.view.getInt8(this.offset); if (val === 0x7F) val = null; break;
                        case 0x00: 
                        case 0x02: 
                        case 0x0A: val = this.view.getUint8(this.offset); if (val === 0xFF) val = null; break;
                        case 0x83: val = this.view.getInt16(this.offset, isLittleEndian); if (val === 0x7FFF) val = null; break;
                        case 0x84: 
                        case 0x8B: val = this.view.getUint16(this.offset, isLittleEndian); if (val === 0xFFFF) val = null; break;
                        case 0x85: val = this.view.getInt32(this.offset, isLittleEndian); if (val === 0x7FFFFFFF) val = null; break;
                        case 0x86: 
                        case 0x8C: val = this.view.getUint32(this.offset, isLittleEndian); if (val === 0xFFFFFFFF) val = null; break;
                        case 0x88: val = this.view.getFloat32(this.offset, isLittleEndian); if (isNaN(val)) val = null; break;
                        case 0x89: val = this.view.getFloat64(this.offset, isLittleEndian); if (isNaN(val)) val = null; break;
                    }
                } catch(e) {}
                this.offset += size; 
                return val;
            }
        }

        function formatTime(totalSeconds) {
            if (totalSeconds === undefined || totalSeconds === null || isNaN(totalSeconds)) return "--:--:--";
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = Math.floor(totalSeconds % 60);
            return [
                h.toString().padStart(2, '0'),
                m.toString().padStart(2, '0'),
                s.toString().padStart(2, '0')
            ].join(':');
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([46.603354, 1.888334], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        function initChart() {
            const ctx = document.getElementById('profileChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#94a3b8',
                            bodyColor: '#f1f5f9',
                            borderColor: '#334155',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: { display: true, text: 'Distance (km)', color: '#94a3b8', font: { size: 10 } },
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8', font: { size: 9 } }
                        },
                        y: {
                            title: { display: true, text: 'Alt. (m)', color: '#94a3b8', font: { size: 10 } },
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8', font: { size: 9 } }
                        }
                    }
                }
            });
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function parseGPX(xmlText, fileName) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, "text/xml");
            const trkpts = xml.querySelectorAll("trkpt");
            
            const points = [];
            let totalDistance = 0;
            let elevationGain = 0;
            let prevPt = null;
            let startTime = null;

            trkpts.forEach((pt) => {
                const lat = parseFloat(pt.getAttribute("lat"));
                const lon = parseFloat(pt.getAttribute("lon"));
                const eleEl = pt.querySelector("ele");
                const ele = eleEl ? parseFloat(eleEl.textContent) : 0;
                
                const timeEl = pt.querySelector("time");
                let elapsedTime = null;
                if (timeEl) {
                    const timeMs = new Date(timeEl.textContent).getTime();
                    if (startTime === null) startTime = timeMs;
                    elapsedTime = (timeMs - startTime) / 1000; 
                }

                if (prevPt) {
                    const d = getDistance(prevPt.lat, prevPt.lon, lat, lon);
                    totalDistance += d;
                    if (ele > prevPt.ele) {
                        elevationGain += (ele - prevPt.ele);
                    }
                }

                points.push({ lat, lon, ele, distance: totalDistance, elapsedTime });
                prevPt = { lat, lon, ele };
            });

            return {
                id: 'track_' + Math.random().toString(36).substr(2, 9),
                name: xml.querySelector("name")?.textContent || fileName.replace(/\.[^/.]+$/, "") + " (GPX)",
                points: points,
                totalDistance: totalDistance,
                elevationGain: Math.round(elevationGain),
                hasTime: startTime !== null
            };
        }

        function parseFIT(fitData, fileName) {
            const points = [];
            let totalDistance = 0;
            let elevationGain = 0;
            let prevPt = null;
            let startTime = null;

            if (!fitData || !fitData.records || fitData.records.length === 0) {
                throw new Error("Aucune coordonnée GPS exploitable.");
            }

            fitData.records.forEach((record) => {
                if (record.position_lat !== undefined && record.position_long !== undefined) {
                    const lat = record.position_lat * (180 / 2147483648);
                    const lon = record.position_long * (180 / 2147483648);
                    const ele = record.enhanced_altitude !== undefined ? record.enhanced_altitude : (record.altitude !== undefined ? record.altitude : 0);

                    let distKm = 0;
                    if (record.distance !== undefined) {
                        distKm = record.distance / 1000;
