<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Comparateur GPX Trail</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; background: #121212; color: #fff; }
    
    /* En-tête et Contrôles */
    #header { background: #1e1e1e; display: flex; flex-direction: column; gap: 6px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.5); padding: 8px 8px 0 8px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #007acc; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
    
    /* Navigation par Onglets */
    .tabs { display: flex; margin-top: 6px; border-bottom: 1px solid #333; }
    .tab-btn { flex: 1; background: transparent; color: #888; border: none; padding: 10px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
    .tab-btn.active { color: #007acc; border-bottom: 2px solid #007acc; }

    #trackList { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
    .track-card { display: flex; align-items: center; background: #2a2a2a; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; gap: 6px; }
    .track-color { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .btn-del { background: #ff4d4d; color: white; border: none; border-radius: 3px; width: 18px; height: 18px; cursor: pointer; line-height: 16px; font-weight: bold; }

    /* Vues des Onglets */
    .tab-content { flex: 1; display: none; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
    .tab-content.active { display: flex; }

    /* Onglet Carte & Profil */
    #map { flex: 1; width: 100%; min-height: 150px; }
    #profileContainer { height: 140px; background: #181818; width: 100%; padding: 4px; }
    #sliderContainer { padding: 8px; background: #1e1e1e; display: flex; align-items: center; gap: 10px; }
    #timeSlider { flex: 1; accent-color: #007acc; }
    #timeDisplay { font-family: monospace; font-size: 14px; width: 65px; text-align: right; }

    /* Onglet Récapitulatif */
    #recapTab { padding: 12px; overflow-y: auto; }
    .recap-table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 320px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #2a2a2a; }
    th { color: #888; font-weight: 600; }
    tr:nth-child(even) { background-color: #181818; }
    .empty-msg { text-align: center; color: #666; padding: 40px 0; font-style: italic; }
  </style>
</head>
<body>

  <div id="header">
    <div class="top-bar">
      <strong>Comparateur GPX</strong>
      <button class="btn" onclick="document.getElementById('gpxInput').click()">+ Ajouter GPX</button>
      <input type="file" id="gpxInput" accept=".gpx" multiple style="display:none" onchange="handleFiles(this.files)">
    </div>
    
    <div id="trackList"></div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('mapViewTab', this)">Carte & Profil</button>
      <button class="tab-btn" onclick="switchTab('recapTab', this)">Récapitulatif</button>
    </div>
  </div>

  <!-- VUE 1 : CARTE ET PROFIL -->
  <div id="mapViewTab" class="tab-content active">
    <div id="map"></div>
    <div id="profileContainer">
      <canvas id="elevationChart"></canvas>
    </div>
    <div id="sliderContainer">
      <input type="range" id="timeSlider" min="0" max="100" value="0" step="1" oninput="updateTimePosition(this.value)">
      <span id="timeDisplay">00:00:00</span>
    </div>
  </div>

  <!-- VUE 2 : RÉCAPITULATIF -->
  <div id="recapTab" class="tab-content">
    <div class="recap-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Trace</th>
            <th>Date</th>
            <th>Temps</th>
            <th>Distance</th>
            <th>D+</th>
          </tr>
        </thead>
        <tbody id="recapTableBody">
          <tr><td colspan="5" class="empty-msg">Aucune trace importée</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const COLORS = ['#FF385C', '#1E90FF', '#2ECC71', '#9B59B6', '#F1C40F', '#E67E22', '#00FFFF'];
    let tracks = [];
    let map, chart;
    let maxDuration = 0;

    // Initialisation Carte
    map = L.map('map').setView([45.0, 6.0], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Initialisation Graphique Profil
    const ctx = document.getElementById('elevationChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: { datasets: [] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: { type: 'linear', title: { display: true, text: 'Distance (km)', color: '#888' }, ticks: { color: '#888' } },
          y: { title: { display: true, text: 'Altitude (m)', color: '#888' }, ticks: { color: '#888' } }
        },
        plugins: { legend: { display: false } }
      }
    });

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function parseGPX(xmlText, fileName) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const trkpts = xml.querySelectorAll("trkpt");
      
      if (trkpts.length === 0) return null;

      let points = [];
      let totalDist = 0;
      let totalDPlus = 0;
      let startTime = null;
      let startDateStr = "N/A";

      trkpts.forEach((pt, i) => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        const eleNode = pt.querySelector("ele");
        const timeNode = pt.querySelector("time");

        const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
        const time = timeNode ? new Date(timeNode.textContent).getTime() : null;

        if (i === 0) {
          startTime = time;
          if (time) {
            const d = new Date(time);
            startDateStr = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
          }
        } else {
          const prev = points[i - 1];
          totalDist += haversine(prev.lat, prev.lon, lat, lon);
          const diffEle = ele - prev.ele;
          if (diffEle > 0) totalDPlus += diffEle;
        }

        const elapsed = startTime && time ? (time - startTime) / 1000 : i;

        points.push({
          lat, lon, ele, 
          distKm: totalDist / 1000, 
          elapsedSeconds: elapsed
        });
      });

      return {
        id: Date.now() + Math.random(),
        name: fileName.replace('.gpx', ''),
        startDate: startDateStr,
        points: points,
        maxTime: points[points.length - 1].elapsedSeconds,
        totalDistance: totalDist / 1000,
        totalDPlus: Math.round(totalDPlus),
        color: COLORS[tracks.length % COLORS.length]
      };
    }

    function handleFiles(files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const track = parseGPX(e.target.result, file.name);
          if (track) {
            addTrack(track);
          }
        };
        reader.readAsText(file);
      });
    }

    function addTrack(track) {
      const latLons = track.points.map(p => [p.lat, p.lon]);
      track.polyline = L.polyline(latLons, { color: track.color, weight: 4 }).addTo(map);
      
      const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<div style="background-color:${track.color}; width:14px; height:14px; border-radius:50%; border:2px solid white;"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      track.marker = L.marker(latLons[0], { icon: customIcon }).addTo(map);

      tracks.push(track);
      
      const group = new L.featureGroup(tracks.map(t => t.polyline));
      map.fitBounds(group.getBounds());

      updateGlobalMaxTime();
      renderUI();
      updateCharts();
      updateTimePosition(document.getElementById('timeSlider').value);
    }

    function removeTrack(id) {
      const idx = tracks.findIndex(t => t.id === id);
      if (idx !== -1) {
        map.removeLayer(tracks[idx].polyline);
        map.removeLayer(tracks[idx].marker);
        tracks.splice(idx, 1);
        updateGlobalMaxTime();
        renderUI();
        updateCharts();
        updateTimePosition(document.getElementById('timeSlider').value);
      }
    }

    function updateGlobalMaxTime() {
      maxDuration = tracks.reduce((max, t) => Math.max(max, t.maxTime), 0);
      const slider = document.getElementById('timeSlider');
      slider.max = maxDuration;
    }

    function getPointAtTime(track, seconds) {
      if (seconds <= 0) return track.points[0];
      if (seconds >= track.maxTime) return track.points[track.points.length - 1];
      return track.points.find(p => p.elapsedSeconds >= seconds) || track.points[track.points.length - 1];
    }

    function updateTimePosition(seconds) {
      document.getElementById('timeDisplay').innerText = formatTime(seconds);

      tracks.forEach(track => {
        const pt = getPointAtTime(track, seconds);
        track.marker.setLatLng([pt.lat, pt.lon]);
      });

      if (chart.data.datasets.length > 0) {
        tracks.forEach((track, i) => {
          const pt = getPointAtTime(track, seconds);
          const cursorDatasetIndex = tracks.length + i;
          if (chart.data.datasets[cursorDatasetIndex]) {
            chart.data.datasets[cursorDatasetIndex].data = [{ x: pt.distKm, y: pt.ele }];
          }
        });
        chart.update('none');
      }
    }

    function updateCharts() {
      const datasets = [];

      tracks.forEach(track => {
        datasets.push({
          label: track.name,
          data: track.points.map(p => ({ x: p.distKm, y: p.ele })),
          borderColor: track.color,
          borderWidth: 2,
          pointRadius: 0,
          fill: false
        });
      });

      tracks.forEach(track => {
        datasets.push({
          label: track.name + ' (Curseur)',
          data: [],
          backgroundColor: track.color,
          borderColor: '#ffffff',
          borderWidth: 2,
          pointRadius: 6,
          showLine: false
        });
      });

      chart.data.datasets = datasets;
      chart.update();
    }

    function renderUI() {
      // 1. Badges supérieurs
      const container = document.getElementById('trackList');
      container.innerHTML = '';
      tracks.forEach(track => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <span class="track-color" style="background:${track.color}"></span>
          <span>${track.name}</span>
          <button class="btn-del" onclick="removeTrack(${track.id})">×</button>
        `;
        container.appendChild(card);
      });

      // 2. Tableau du récapitulatif
      const tableBody = document.getElementById('recapTableBody');
      if (tracks.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="empty-msg">Aucune trace importée</td></tr>';
        return;
      }

      tableBody.innerHTML = '';
      tracks.forEach(track => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <span class="track-color" style="background:${track.color}"></span>
            <strong>${track.name}</strong>
          </td>
          <td>${track.startDate}</td>
          <td>${formatTime(track.maxTime)}</td>
          <td>${track.totalDistance.toFixed(2)} km</td>
          <td>${track.totalDPlus} m</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'mapViewTab') {
        setTimeout(() => map.invalidateSize(), 100);
      }
    }

    function formatTime(sec) {
      const hrs = Math.floor(sec / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = Math.floor(sec % 60);
      return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
  </script>
</body>
</html>
